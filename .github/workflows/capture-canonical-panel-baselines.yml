name: Capture canonical panel baselines

on:
  workflow_dispatch:
    inputs:
      approved:
        description: Confirm this run is authorized to write committed PNG baselines
        required: true
        default: false
        type: boolean

permissions: {}

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
  VISUAL_DELTA_CANONICAL_PANEL_SNAPSHOTS: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: capture-canonical-panel-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture canonical ARM64 panel references
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:71968d021eb75280f66dec675bc2b8b9e2224734cf58ca1ea0c06019969df705
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - name: Require explicit baseline authorization on the default branch
        env:
          BASELINE_WRITE_APPROVED: ${{ inputs.approved }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$BASELINE_WRITE_APPROVED" = "true"
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

      - name: Check out the selected revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: deno task ci:install

      - name: Capture only missing canonical panel references
        # Playwright exits 1 after writing an absent expected snapshot.
        # Exact-set and compare-only verification remain required gates.
        continue-on-error: true
        run: >-
          playwright test -c playwright.panel.config.ts
          --update-snapshots=missing

      - name: Verify and record the exact browser-only capture set
        run: |
          snapshot_root=tests/panel.spec.ts-snapshots
          expected_paths=(
            "$snapshot_root/narrow-right/capture-error-chromium.png"
            "$snapshot_root/narrow-right/missing-baseline-chromium.png"
            "$snapshot_root/narrow-right/mixed-mode-failure-chromium.png"
            "$snapshot_root/narrow-right/passed-chromium.png"
            "$snapshot_root/wide-bottom/capture-error-chromium.png"
            "$snapshot_root/wide-bottom/missing-baseline-chromium.png"
            "$snapshot_root/wide-bottom/mixed-mode-failure-chromium.png"
            "$snapshot_root/wide-bottom/passed-chromium.png"
          )
          for snapshot in "${expected_paths[@]}"; do
            test -f "$snapshot"
          done
          actual_paths="$(find "$snapshot_root" -type f -name '*-chromium.png' -print | sort)"
          expected_paths_text="$(printf '%s\n' "${expected_paths[@]}")"
          test "$actual_paths" = "$expected_paths_text"
          deno task test:panel
          manifest_path="$RUNNER_TEMP/panel-canonical-snapshot-checksums.txt"
          printf '%s\n' "$actual_paths" | xargs sha256sum > "$manifest_path"

      - name: Upload canonical panel references for review
        uses: actions/upload-artifact@v6
        with:
          name: canonical-panel-baselines-${{ github.sha }}
          path: |
            tests/panel.spec.ts-snapshots/**/*-chromium.png
            ${{ runner.temp }}/panel-canonical-snapshot-checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Open a baseline-review pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/canonical-panel-baselines-${{ github.run_id }}
          delete-branch: true
          draft: true
          commit-message: Add canonical ARM64 panel baselines
          title: Add canonical ARM64 panel baselines
          body: |
            Generated by the manually dispatched canonical panel-baseline workflow.

            - Runs on Linux/ARM64 and writes browser-only panel references.
            - Verifies the exact eight-image set and reruns `deno task test:panel` compare-only.
            - Retains checksums and generated PNGs as the matching workflow artifact.
          add-paths: |
            tests/panel.spec.ts-snapshots/**/*-chromium.png
