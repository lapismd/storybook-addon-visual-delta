name: Visual Delta CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: read

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

defaults:
  run:
    shell: bash

concurrency:
  group: visual-delta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package typecheck and unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build node exports
        run: pnpm build:node

      - name: Typecheck package sources
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  panel:
    name: Panel browser acceptance
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:c45eaf81d375fcbf4fd275df6029d776c3bb452aba0e0be3188eaebf1b9201bd
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run panel acceptance
        run: pnpm test:panel

  browser-matrix:
    name: Chromium, Firefox, and WebKit acceptance
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:c45eaf81d375fcbf4fd275df6029d776c3bb452aba0e0be3188eaebf1b9201bd
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser-matrix acceptance
        env:
          HOME: /root
        run: pnpm test:browsers

  manager:
    name: Manager browser acceptance
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:c45eaf81d375fcbf4fd275df6029d776c3bb452aba0e0be3188eaebf1b9201bd
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Trust the checkout for baseline history
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run manager acceptance
        run: pnpm test:manager --trace=retain-on-failure

      - name: Retain manager failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: manager-failure-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
