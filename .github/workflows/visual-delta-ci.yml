name: Visual Delta CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: read

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest

defaults:
  run:
    shell: bash

concurrency:
  group: visual-delta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package typecheck and unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install dependencies
        run: deno task ci:install

      - name: Build node exports
        run: deno task build:node

      - name: Typecheck package sources
        run: deno task typecheck

      - name: Unit tests
        run: deno task test

  panel:
    name: Panel browser acceptance
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:71968d021eb75280f66dec675bc2b8b9e2224734cf58ca1ea0c06019969df705
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install dependencies
        run: deno task ci:install

      - name: Run panel acceptance
        run: deno task test:panel

  browser-matrix:
    name: Chromium, Firefox, and WebKit acceptance
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:71968d021eb75280f66dec675bc2b8b9e2224734cf58ca1ea0c06019969df705
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install dependencies
        run: deno task ci:install

      - name: Run browser-matrix acceptance
        env:
          HOME: /root
        run: deno task test:browsers

  manager:
    name: Manager browser acceptance
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci@sha256:71968d021eb75280f66dec675bc2b8b9e2224734cf58ca1ea0c06019969df705
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Trust the checkout for baseline history
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: deno task ci:install

      - name: Run manager acceptance
        run: deno task test:manager
