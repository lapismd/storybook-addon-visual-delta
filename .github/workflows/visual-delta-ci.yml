name: Visual Delta CI

on:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest

defaults:
  run:
    shell: bash

concurrency:
  group: visual-delta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package typecheck and unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build node exports
        run: pnpm build:node

      - name: Typecheck package sources
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  panel:
    name: Panel browser acceptance
    # PROFILE_LOCK_PENDING: replace :latest with the published immutable ARM64 digest.
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run panel acceptance
        run: pnpm test:panel

  browser-matrix:
    name: Chromium, Firefox, and WebKit acceptance
    # PROFILE_LOCK_PENDING: replace :latest with the published immutable ARM64 digest.
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser-matrix acceptance
        run: pnpm test:browsers

  manager:
    name: Manager browser acceptance
    # PROFILE_LOCK_PENDING: replace :latest with the published immutable ARM64 digest.
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run manager acceptance
        run: pnpm test:manager
