name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-gates:
    name: Validate release and package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      bootstrap: ${{ steps.release.outputs.bootstrap }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact release metadata
        id: release
        run: |
          pnpm release:check --tag "${GITHUB_REF_NAME}"
          version="$(node -e "console.log(require('./package.json').version)")"
          bootstrap=false
          if [ "$version" = "0.0.1" ]; then
            bootstrap=true
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'bootstrap=%s\n' "$bootstrap" >> "$GITHUB_OUTPUT"

      - name: Check the canonical specification
        run: pnpm spec:check

      - name: Build node exports
        run: pnpm build:node

      - name: Typecheck package sources
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit

      - name: Verify npm package contents
        run: pnpm pack --dry-run

      - name: Run compare-only panel acceptance
        run: pnpm test:panel

      - name: Run compare-only manager acceptance
        run: pnpm test:manager

  publish-bootstrap:
    name: Publish bootstrap release
    needs: release-gates
    if: needs.release-gates.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    environment:
      name: npm-bootstrap
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable exports
        run: pnpm build:node

      - name: Publish one-time bootstrap release with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish --provenance --access public --registry=https://registry.npmjs.org

  publish-oidc:
    name: Publish trusted release
    needs: release-gates
    if: needs.release-gates.outputs.bootstrap != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    environment:
      name: npm
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable exports
        run: pnpm build:node

      - name: Publish trusted release with provenance
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org

  verify-provenance:
    name: Verify npm Sigstore provenance
    needs:
      - release-gates
      - publish-bootstrap
      - publish-oidc
    if: >-
      always() &&
      needs.release-gates.result == 'success' &&
      (needs.publish-bootstrap.result == 'success' || needs.publish-oidc.result == 'success')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Wait for the exact npm version
        env:
          PACKAGE_NAME: '@lapismd/storybook-addon-visual-delta'
          VERSION: ${{ needs.release-gates.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            published="$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ]; then
              exit 0
            fi
            if [ "$attempt" = "12" ]; then
              echo "${PACKAGE_NAME}@${VERSION} was not available from npm after 120 seconds" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install the published package in a clean project
        env:
          PACKAGE_NAME: '@lapismd/storybook-addon-visual-delta'
          VERSION: ${{ needs.release-gates.outputs.version }}
        run: |
          verify_dir="$RUNNER_TEMP/npm-provenance-verify"
          mkdir -p "$verify_dir"
          cd "$verify_dir"
          npm init --yes
          npm install --ignore-scripts --package-lock=true "${PACKAGE_NAME}@${VERSION}"
          installed="$(node -e "console.log(require('./node_modules/@lapismd/storybook-addon-visual-delta/package.json').version)")"
          test "$installed" = "$VERSION"

      - name: Verify registry signatures and Sigstore provenance
        env:
          VERSION: ${{ needs.release-gates.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/npm-provenance-verify"
          npm audit signatures --json --include-attestations > "$GITHUB_WORKSPACE/npm-signatures.json"
          node "$GITHUB_WORKSPACE/scripts/verify-npm-provenance.mjs" \
            --audit "$GITHUB_WORKSPACE/npm-signatures.json" \
            --version "$VERSION"

      - name: Retain signature verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-signatures-${{ needs.release-gates.outputs.version }}
          path: npm-signatures.json
          if-no-files-found: warn
          retention-days: 90
