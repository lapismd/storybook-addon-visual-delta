name: Prepare version and approve release tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source:
        description: Exact approved Version Packages commit on main (40-character SHA)
        required: true
        type: string
      create_tag:
        description: Create the approved public tag and start npm release qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-delta-release
  cancel-in-progress: false

jobs:
  version:
    name: Update Version Packages pull request
    if: github.event_name == 'push' && github.repository == 'lapismd/storybook-addon-visual-delta' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.version-runtime.outputs.hasChangesets }}
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Qualify source-owned version inputs and actual release intent
        id: version-runtime
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dc81ff65ba812bf005fb2a806eb3308bb8b5f71f
        with:
          qualification-file: .github/versioning-runtime.json
          detect-release-intent: "true"

      - name: Create repository version token
        id: version-app
        if: github.event_name == 'push' && github.repository == 'lapismd/storybook-addon-visual-delta' && github.ref == 'refs/heads/main' && steps.version-runtime.outputs.hasChangesets == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: storybook-addon-visual-delta
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Version Packages pull request
        id: changesets
        if: steps.version-runtime.outputs.hasChangesets == 'true'
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm release:version
          commit: Version Packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.version-app.outputs.token }}

  tag:
    name: Create explicitly approved release tag
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lapismd/storybook-addon-visual-delta' && github.ref == 'refs/heads/main' && inputs.create_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require an exact approved revision
        env:
          RELEASE_SOURCE: ${{ inputs.source }}
        run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.RELEASE_SOURCE || "")) throw Error("An exact approved source SHA is required");'

      - name: Require workflow-triggering tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "RELEASE_TAG_TOKEN must be set so pushed v* tags can trigger npm-publish.yml."
            exit 1
          fi

      - name: Check out the approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.source }}
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate approved source and release intent
        env:
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_APPROVED: ${{ inputs.create_tag }}
          RELEASE_AUDIT_APPROVED_SOURCE: ${{ vars.VD_015_AUDIT_APPROVED_SOURCE }}
        run: node scripts/check-release-source.mjs

      - name: Qualify exact audit and artifact before creating an immutable tag
        env:
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_AUDIT_APPROVED_SOURCE: ${{ vars.VD_015_AUDIT_APPROVED_SOURCE }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          GITHUB_SHA="$RELEASE_SOURCE" GITHUB_REF="refs/tags/v$version" node scripts/check-release-audit.mjs

      - name: Retain pre-tag audit and candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-audit-pre-tag-${{ inputs.source }}
          path: .cache/release-audit/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Ensure exact stable release tag
        run: pnpm release:tag --push
