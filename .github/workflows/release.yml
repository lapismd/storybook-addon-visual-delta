name: Version and tag release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: visual-delta-release
  cancel-in-progress: false

jobs:
  version:
    name: Update Version Packages pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version Packages pull request
        id: changesets
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          commit: Version Packages
          title: Version Packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Create release tag
    needs: version
    if: needs.version.outputs.has_changesets != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require workflow-triggering tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "RELEASE_TAG_TOKEN must be set so pushed v* tags can trigger npm-publish.yml."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure exact stable release tag
        run: pnpm release:tag --push
