name: Prepare version and approve release tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source:
        description: Exact approved Version Packages commit on main (40-character SHA)
        required: true
        type: string
      create_tag:
        description: Create the approved public tag and start npm release qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-delta-release
  cancel-in-progress: false

jobs:
  version:
    name: Update Version Packages pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version Packages pull request
        id: changesets
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          commit: Version Packages
          title: Version Packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Create explicitly approved release tag
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lapismd/storybook-addon-visual-delta' && github.ref == 'refs/heads/main' && inputs.create_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require an exact approved revision
        env:
          RELEASE_SOURCE: ${{ inputs.source }}
        run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.RELEASE_SOURCE || "")) throw Error("An exact approved source SHA is required");'

      - name: Require workflow-triggering tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "RELEASE_TAG_TOKEN must be set so pushed v* tags can trigger npm-publish.yml."
            exit 1
          fi

      - name: Check out the approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.source }}
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate approved source and release intent
        env:
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_APPROVED: ${{ inputs.create_tag }}
        run: node scripts/check-release-source.mjs

      - name: Ensure exact stable release tag
        run: pnpm release:tag --push
