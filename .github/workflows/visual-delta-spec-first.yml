name: Visual Delta Spec First

on:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
  HOME: /root

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Visual Delta specification
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the canonical specification
        run: pnpm spec:lint

      - name: Validate the canonical specification
        run: pnpm spec:validate

      - name: Build the mdBook
        run: pnpm spec:build

      - name: Test the specification checkers
        run: pnpm spec:test

      - name: Enforce specification-first changes
        run: >-
          pnpm spec:first --
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
