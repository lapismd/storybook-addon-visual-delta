name: Visual Delta Spec First

on:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  VISUAL_DELTA_CI_IMAGE: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Visual Delta specification
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/storybook-addon-visual-delta-ci:latest
      env:
        HOME: /root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the checkout from the root-owned container home
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run configured specification gate
        run: >-
          pnpm spec:check --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Enforce public package release intent
        if: github.head_ref != 'changeset-release/main'
        run: >-
          pnpm release:intent --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
