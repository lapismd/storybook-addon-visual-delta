name: Capture Linux panel baselines

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: capture-linux-panel-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture missing Linux panel references
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

      - name: Check out the selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture only missing Linux panel references
        run: >-
          pnpm exec playwright test -c playwright.panel.config.ts
          --update-snapshots=missing

      - name: Verify and record the capture set
        run: |
          snapshot_root=tests/panel.spec.ts-snapshots
          expected_paths=(
            "$snapshot_root/narrow-right/capture-error-chromium-linux.png"
            "$snapshot_root/narrow-right/missing-baseline-chromium-linux.png"
            "$snapshot_root/narrow-right/mixed-mode-failure-chromium-linux.png"
            "$snapshot_root/narrow-right/passed-chromium-linux.png"
            "$snapshot_root/wide-bottom/capture-error-chromium-linux.png"
            "$snapshot_root/wide-bottom/missing-baseline-chromium-linux.png"
            "$snapshot_root/wide-bottom/mixed-mode-failure-chromium-linux.png"
            "$snapshot_root/wide-bottom/passed-chromium-linux.png"
          )
          for snapshot in "${expected_paths[@]}"; do
            test -f "$snapshot"
          done
          actual_paths="$(find "$snapshot_root" -type f -name '*-chromium-linux.png' -print | sort)"
          expected_paths_text="$(printf '%s\n' "${expected_paths[@]}")"
          test "$actual_paths" = "$expected_paths_text"
          manifest_path="$RUNNER_TEMP/panel-linux-snapshot-checksums.txt"
          printf '%s\n' "$actual_paths" | xargs sha256sum > "$manifest_path"
          pnpm test:panel

      - name: Upload Linux panel references for review
        uses: actions/upload-artifact@v4
        with:
          name: linux-panel-baselines-${{ github.sha }}
          path: |
            tests/panel.spec.ts-snapshots/**/*-chromium-linux.png
            ${{ runner.temp }}/panel-linux-snapshot-checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Open a baseline-review pull request
        id: baseline_pull_request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/linux-panel-baselines-${{ github.run_id }}
          delete-branch: true
          draft: true
          commit-message: Add Linux panel baselines
          title: Add Linux panel baselines
          body: |
            Generated by the manually dispatched Linux panel-baseline workflow.

            - Captures only missing `*-chromium-linux.png` panel references.
            - Verifies the exact eight-image set and reruns `pnpm test:panel` compare-only.
            - Retains checksums and generated PNGs as the matching workflow artifact.
          add-paths: |
            tests/panel.spec.ts-snapshots/**/*-chromium-linux.png
